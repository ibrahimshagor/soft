    <script>
      (function() {
        try {
          var saved = localStorage.getItem('RM_THEME');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
            if (!saved) localStorage.setItem('RM_THEME', 'light');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
